                <a href="#" class="nav-link fw-bold fs-3 text-dark">CVR COLLEGE OF ENGINEERING</a>
                <a href="home.html" class="nav-link text-dark fw-semibold px-4 py-3 fs-5">Home</a>
                <a href="about.html" class="nav-link text-dark fw-semibold px-4 py-3 fs-5">About</a>
                <div class="nav-item dropdown">
                    <a href="courses.html" class="nav-link dropdown-toggle text-dark fw-semibold px-4 py-3 fs-5"

                        Course

                    <ul class="dropdown-menu">

                <button type="button" class="btn btn-warning shadow-lg text-dark">Register</button>
            </div>
        </nav>
    </header>
    <div class="cotainer-fluid mt-5">
        <div class="card bg-warning text-dark">
            <div class="card-header text-center" >
                <h4>Welcome To Dashboard</h4>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row mb-5">
            <div class="col-md-3 mb-3">
                <div class="card bg-orange text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Total Students</h5>
                        <p class="card-text display-6">3</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card bg-warning text-dark">
                    <div class="card-body">
                        <h5 class="card-title">Present Students</h5>
                        <p class="card-text display-6">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-orange text-dark" >
                    <div class="card-body">
                        <h5 class="card-title">Absent Students</h5>
                        <p class="card-text display-6">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-warning text-dark" >
                    <div class="card-body">
                        <h5 class="card-title">Placements</h5>
                        <p class="card-text display-6">0</p>
                    </div>
                </div>
            </div>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Attendance</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Shanmukha</td>
                    <td>CSE</td>
                    <td>
                        <div class="btn-group" role="group">
                            <input type="radio" class="btn-check" name="attendance1" id="present1" autocomplete="off">
                            <label class="btn btn-outline-success" for="present1">Present</label>
                            <input type="radio" class="btn-check" name="attendance1" id="absent1" autocomplete="off">
                            <label class="btn btn-outline-danger" for="absent1">Absent</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Rohith</td>
                    <td>CSE</td>
                    <td>
                        <div class="btn-group" role="group">
                            <input type="radio" class="btn-check" name="attendance2" id="present2" autocomplete="off">
                            <label class="btn btn-outline-success" for="present2">Present</label>
                            <input type="radio" class="btn-check" name="attendance2" id="absent2" autocomplete="off">
                            <label class="btn btn-outline-danger" for="absent2">Absent</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Vishnu</td>
                    <td>CSE</td>
                    <td>
                        <div class="btn-group" role="group">
                            <input type="radio" class="btn-check" name="attendance3" id="present3" autocomplete="off">
                            <label class="btn btn-outline-success" for="present3">Present</label>
                            <input type="radio" class="btn-check" name="attendance3" id="absent3" autocomplete="off">
                            <label class="btn btn-outline-danger" for="absent3">Absent</label>
                        </div>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>
