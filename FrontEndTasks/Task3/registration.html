<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration | College Event Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">EventHub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link active" href="registration.html">Registration</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="text-center mb-4">
      <h1>Event Registration</h1>
      <p class="text-muted">Fill in your details to secure your spot at the event.</p>
    </div>
    <div id="alertPlaceholder"></div>
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <form id="registrationForm" class="row g-3">
          <div class="col-md-6">
            <label for="studentName" class="form-label">Student Name</label>
            <input type="text" class="form-control" id="studentName" required>
          </div>
          <div class="col-md-6">
            <label for="rollNumber" class="form-label">Roll Number</label>
            <input type="text" class="form-control" id="rollNumber" required>
          </div>
          <div class="col-md-6">
            <label for="branch" class="form-label">Branch</label>
            <select class="form-select" id="branch" required>
              <option value="">Select Branch</option>
              <option>Computer Science</option>
              <option>Electronics</option>
              <option>Mechanical</option>
              <option>Business</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="col-md-6">
            <label for="mobile" class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" id="mobile" required>
          </div>
          <div class="col-md-6">
            <label for="eventSelect" class="form-label">Event Selection</label>
            <select class="form-select" id="eventSelect" required>
              <option value="">Choose Event</option>
              <option>Technical Quiz</option>
              <option>Hackathon</option>
              <option>Poster Presentation</option>
              <option>Coding Contest</option>
              <option>Project Expo</option>
              <option>Cultural Fest</option>
            </select>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Submit Registration</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-primary text-white text-center py-4">
    <p class="mb-0">Need help? Visit <a href="faq.html" class="text-white text-decoration-underline">FAQ</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
